name: million_dollar_way
description: Командний пункт для управління активами та податками.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  animations: ^2.0.11
  fl_chart: ^0.68.0
  http: ^1.2.0
  xml: ^6.5.0
  file_picker: ^8.0.0
  intl: ^0.19.0
  csv: ^6.0.0
  share_plus: ^9.0.0
  path_provider: ^2.1.2
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.0
  firebase_messaging: ^14.7.0
  flutter_local_notifications: ^17.0.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
