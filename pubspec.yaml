name: million_dollar_way
description: Командний пункт для управління активами та податками.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  animations: ^2.0.11
  fl_chart: ^1.1.1
  http: ^1.6.0
  xml: ^6.6.1
  file_picker: ^10.3.8
  intl: ^0.19.0
  csv: ^6.0.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.2
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2

# Конфігурація для генерації іконок
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0F0F0F"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/